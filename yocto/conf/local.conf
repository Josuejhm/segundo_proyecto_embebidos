# =============================================================================
# local.conf — AGRI-EDGE-IA para Jetson Nano (VERSIÓN CORREGIDA)
# =============================================================================
# CAMBIOS vs versión anterior (que no bootaba):
#   + KERNEL_DEVICETREE  → el FDT_ERR_BADMAGIC venía de esto
#   + TEGRA_ROOTDEV      → SD card (mmcblk1), no eMMC (mmcblk0)
#   + WKS_FILE           → layout de particiones correcto
#   + IMAGE_FSTYPES += "wic"  → imagen flasheable directamente con dd
# =============================================================================

# ---------------------------------------------------------------------------
# MACHINE — Jetson Nano Developer Kit (tegra210 / Maxwell)
# ---------------------------------------------------------------------------
MACHINE = "jetson-nano-devkit"
DISTRO  = "poky"

# ---------------------------------------------------------------------------
# KERNEL — L4T r32.7.x usa kernel 4.9
# (r32.7.x es el branch que usamos de meta-tegra — no usar r35.x)
# ---------------------------------------------------------------------------
PREFERRED_VERSION_linux-tegra    = "4.9.%"
PREFERRED_VERSION_linux-tegra-rt = "4.9.%"

# ---------------------------------------------------------------------------
# DEVICE TREE — CRÍTICO
# Sin esto dosdcard.sh falla con FDT_ERR_BADMAGIC y el Jetson no bootea
#
# Jetson Nano Developer Kit A02 (la más común, 1 conector CSI):
KERNEL_DEVICETREE = "tegra210-p3448-0000-p3449-0000-a02.dtb"
#
# Si tienes la B01 (4GB RAM, 2 conectores CSI, placa más nueva), comentar
# la línea de arriba y descomentar esta:
# KERNEL_DEVICETREE = "tegra210-p3448-0002-p3449-0000-b00.dtb"
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# SD CARD ROOT — CRÍTICO
# mmcblk1 = microSD en Jetson Nano (mmcblk0 es la eMMC interna)
# ---------------------------------------------------------------------------
TEGRA_ROOTDEV      = "mmcblk1p1"
TEGRA_FLASH_SDCARD = "1"

# ---------------------------------------------------------------------------
# WIC — imagen .wic pre-particionada, flasheable con dd directamente
# Evita usar dosdcard.sh (que tenía el bug del DTB)
# ---------------------------------------------------------------------------
WKS_FILE     = "jetson-nano-sd-card.wks.in"
IMAGE_FSTYPES += "wic wic.bz2 ext4"

# ---------------------------------------------------------------------------
# LICENCIAS NVIDIA
# ---------------------------------------------------------------------------
LICENSE_FLAGS_ACCEPTED = "nvidia-tegra synaptics-killswitch"

# ---------------------------------------------------------------------------
# CUDA — 10.2 es el MÁXIMO para Maxwell/Jetson Nano
# NO usar CUDA 11.x (requiere JetPack 5.x, incompatible con tegra210)
# ---------------------------------------------------------------------------
# CUDA_VERSION = "10.2"  # meta-tegra lo establece automáticamente

# ---------------------------------------------------------------------------
# DIRECTORIOS DE BUILD (volúmenes Docker)
# ---------------------------------------------------------------------------
SSTATE_DIR = "/yocto/sstate"
DL_DIR     = "/yocto/dl"

# ---------------------------------------------------------------------------
# PARALELISMO
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# SYSTEMD — activar para los services de AGRI-EDGE-IA y Ollama
# ---------------------------------------------------------------------------
DISTRO_FEATURES:append = " systemd alsa pulseaudio pam"
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts      = ""
PREFERRED_PROVIDER_udev          = "systemd"
PREFERRED_PROVIDER_udev-utils    = "systemd"

# ---------------------------------------------------------------------------
# AUDIO — habilitar ALSA en DISTRO_FEATURES
# ---------------------------------------------------------------------------
DISTRO_FEATURES:append = " alsa pulseaudio"

# ---------------------------------------------------------------------------
# TAMAÑO — imagen grande para acomodar el stack ML
# ~15GB total: 10GB rootfs base + 5GB extra para modelos y datos
# ---------------------------------------------------------------------------
IMAGE_ROOTFS_SIZE        = "10485760"
IMAGE_ROOTFS_EXTRA_SPACE = "5242880"

# ---------------------------------------------------------------------------
# OPTIMIZACIÓN build
# ---------------------------------------------------------------------------
BB_SIGNATURE_HANDLER = "OEBasicHash"
INHERIT += "buildstats"
BB_CONSOLELOG = "/yocto/build/tmp/log/cooker.log"

# ---------------------------------------------------------------------------
# PACKAGE CLASSES — usar rpm o ipk según prefieras
# ---------------------------------------------------------------------------
PACKAGE_CLASSES ?= "package_ipk"

# ============================================
# Yocto-Qwen Configuration
# ============================================

MACHINE = "jetson-nano-devkit"
DISTRO = "poky"

BB_NUMBER_THREADS = "15"
PARALLEL_MAKE = "-j 15"

SSTATE_DIR = "/yocto/sstate"
DL_DIR = "/yocto/dl"

BB_HASHSERVE = "auto"
BB_HASHSERVE_UPSTREAM = ""

LICENSE_FLAGS_ACCEPTED = "nvidia-tegra"

LAYERSERIES_CORENAMES = "kirkstone"

BAD_RECOMMENDATIONS += "alsa-topology-conf bats"
BAD_RECOMMENDATIONS += "iso-codes iso-codes-locale iso-codes-dev iso-codes-dbg alsa-topology-conf bats"
PACKAGECONFIG:remove:pn-gstreamer1.0-plugins-base = "orc"
WKS_SEARCH_PATH:prepend = "/yocto/layers/meta-tegra/wic:"
IMAGE_BOOT_FILES = "Image tegra210-p3448-0000-p3449-0000-a02.dtb extlinux.conf;extlinux/extlinux.conf"
